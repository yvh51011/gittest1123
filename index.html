<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WordNest — 영어 단어 학습</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-orb bg-orb--a" aria-hidden="true"></div>
  <div class="bg-orb bg-orb--b" aria-hidden="true"></div>

  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">W</span>
        <div>
          <h1 class="brand__name">WordNest</h1>
          <p class="brand__tag">영어 단어를 가볍게, 꾸준히</p>
        </div>
      </div>
      <div class="stats" id="stats">
        <div class="stat">
          <span class="stat__value" id="statKnown">0</span>
          <span class="stat__label">외움</span>
        </div>
        <div class="stat">
          <span class="stat__value" id="statLearning">0</span>
          <span class="stat__label">학습중</span>
        </div>
        <div class="stat">
          <span class="stat__value" id="statStreak">0</span>
          <span class="stat__label">연속</span>
        </div>
      </div>
    </header>

    <section class="auth-bar" id="authBar" aria-live="polite">
      <div class="auth-guest" id="authGuest">
        <p class="auth-bar__text">계정으로 로그인하면 학습을 이어서 관리할 수 있어요.</p>
        <button type="button" class="btn btn--ghost" id="btnOpenAuth">로그인 / 회원가입</button>
      </div>
      <div class="auth-user" id="authUser" hidden>
        <div class="auth-user__info">
          <span class="auth-user__label">로그인됨</span>
          <strong class="auth-user__email" id="authUserEmail"></strong>
          <span class="auth-user__meta" id="authUserMeta"></span>
        </div>
        <button type="button" class="btn btn--ghost" id="btnLogout">로그아웃</button>
      </div>
      <p class="auth-message" id="authMessage" hidden></p>
      <p class="sync-status" id="syncStatus" hidden></p>
    </section>

    <div class="auth-modal" id="authModal" hidden>
      <div class="auth-modal__backdrop" data-close-auth></div>
      <div class="auth-modal__panel" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
        <div class="auth-modal__head">
          <h2 id="authModalTitle">계정</h2>
          <button type="button" class="btn btn--icon" id="btnCloseAuth" aria-label="닫기">×</button>
        </div>
        <div class="auth-mode-tabs">
          <button type="button" class="auth-mode-tab is-active" data-auth-mode="login">로그인</button>
          <button type="button" class="auth-mode-tab" data-auth-mode="signup">회원가입</button>
        </div>
        <form class="auth-form" id="authForm">
          <label class="auth-field">
            <span>이메일</span>
            <input type="email" id="authEmail" name="email" required autocomplete="email" placeholder="you@example.com" />
          </label>
          <label class="auth-field">
            <span>비밀번호</span>
            <input type="password" id="authPassword" name="password" required autocomplete="current-password" minlength="6" placeholder="6자 이상" />
          </label>
          <p class="auth-form__hint" id="authFormHint">비밀번호는 Supabase에만 안전하게 전달되며, 이 앱에 저장되지 않습니다.</p>
          <p class="auth-form__error" id="authFormError" hidden></p>
          <button type="submit" class="btn btn--primary" id="authSubmit">로그인</button>
        </form>
        <p class="auth-verify" id="authVerifyHint" hidden>
          가입 확인 메일을 보냈습니다. 메일함에서 인증 링크를 누른 뒤 다시 로그인해 주세요.
          (스팸함도 확인해 보세요.)
        </p>
      </div>
    </div>

    <nav class="tabs" role="tablist">
      <button class="tab is-active" data-mode="flash" role="tab" aria-selected="true">플래시카드</button>
      <button class="tab" data-mode="quiz" role="tab" aria-selected="false">퀴즈</button>
      <button class="tab" data-mode="list" role="tab" aria-selected="false">단어장</button>
    </nav>

    <main>
      <!-- Flashcard mode -->
      <section id="panel-flash" class="panel is-active" role="tabpanel">
        <div class="progress-bar" aria-hidden="true">
          <div class="progress-bar__fill" id="flashProgress"></div>
        </div>
        <p class="panel-hint" id="flashHint">카드를 클릭하면 뜻이 보입니다</p>

        <button class="flashcard" id="flashcard" type="button" aria-label="카드 뒤집기">
          <div class="flashcard__inner" id="flashInner">
            <div class="flashcard__face flashcard__face--front">
              <span class="flashcard__pos" id="flashPos"></span>
              <span class="flashcard__word" id="flashWord"></span>
              <span class="flashcard__example" id="flashExample"></span>
            </div>
            <div class="flashcard__face flashcard__face--back">
              <span class="flashcard__pos" id="flashPosBack"></span>
              <span class="flashcard__word flashcard__word--ko" id="flashMeaning"></span>
              <span class="flashcard__example" id="flashExampleKo"></span>
            </div>
          </div>
        </button>

        <div class="flash-actions">
          <button type="button" class="btn btn--ghost" id="btnAgain">모르겠어요</button>
          <button type="button" class="btn btn--primary" id="btnKnow">외웠어요</button>
        </div>
        <div class="flash-nav">
          <button type="button" class="btn btn--icon" id="btnPrev" aria-label="이전 단어">←</button>
          <span class="flash-count" id="flashCount">1 / 1</span>
          <button type="button" class="btn btn--icon" id="btnNext" aria-label="다음 단어">→</button>
        </div>
      </section>

      <!-- Quiz mode -->
      <section id="panel-quiz" class="panel" role="tabpanel" hidden>
        <div class="quiz-meta">
          <span id="quizProgress">문제 1 / 10</span>
          <span id="quizScore">점수 0</span>
        </div>
        <div class="quiz-card">
          <p class="quiz-prompt">다음 단어의 뜻은?</p>
          <h2 class="quiz-word" id="quizWord">—</h2>
          <p class="quiz-example" id="quizExample"></p>
          <div class="quiz-choices" id="quizChoices"></div>
          <p class="quiz-feedback" id="quizFeedback" hidden></p>
        </div>
        <div class="quiz-actions">
          <button type="button" class="btn btn--primary" id="btnQuizNext" hidden>다음 문제</button>
          <button type="button" class="btn btn--ghost" id="btnQuizRestart" hidden>다시 풀기</button>
        </div>
      </section>

      <!-- Word list mode -->
      <section id="panel-list" class="panel" role="tabpanel" hidden>
        <form class="add-form" id="addForm">
          <input type="text" id="inputEn" placeholder="영어 단어" required autocomplete="off" />
          <input type="text" id="inputKo" placeholder="한국어 뜻" required autocomplete="off" />
          <input type="text" id="inputPos" placeholder="품사 (선택)" autocomplete="off" />
          <button type="submit" class="btn btn--primary">추가</button>
        </form>
        <div class="list-toolbar">
          <input type="search" id="searchWords" placeholder="단어 검색…" autocomplete="off" />
          <select id="filterStatus">
            <option value="all">전체</option>
            <option value="new">새 단어</option>
            <option value="learning">학습중</option>
            <option value="known">외움</option>
          </select>
        </div>
        <ul class="word-list" id="wordList"></ul>
      </section>
    </main>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
